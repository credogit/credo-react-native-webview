<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credo Payment Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .card-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .row:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #666;
        }
        .value {
            font-weight: 500;
            color: #333;
        }
        .total {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }
        .total .value {
            font-size: 18px;
            color: #007bff;
        }
        .pay-btn {
            width: 100%;
            padding: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .pay-btn:hover {
            background: #0056b3;
        }
        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
        }
        .info strong {
            display: block;
            margin-bottom: 5px;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .status.cancelled {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Credo Payment Demo</h1>
        <p class="subtitle">Test the Credo payment integration</p>

        <div class="card">
            <div class="card-title">Order Summary</div>
            <div class="row">
                <span class="label">Item:</span>
                <span class="value">Premium Subscription</span>
            </div>
            <div class="row">
                <span class="label">Duration:</span>
                <span class="value">1 Month</span>
            </div>
            <div class="row total">
                <span class="label">Total:</span>
                <span class="value">&#8358;3,500.00</span>
            </div>
        </div>

        <button class="pay-btn" onclick="payWithCredo()">
            Pay Now
        </button>

        <div id="status" class="status"></div>

        <div class="info">
            <strong>Note:</strong>
            This demo requires a valid Credo public key. Get one from
            <a href="https://credocentral.com" target="_blank">credocentral.com</a>.
            The payment modal will appear when you click "Pay Now".
        </div>
    </div>

    <!-- Credo Inline Script -->
    <script src="https://www.credocentral.com/inline.js"></script>

    <script>
        function payWithCredo() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status';
            statusEl.style.display = 'none';

            // Check if CredoCheckout is available
            if (typeof CredoCheckout === 'undefined') {
                statusEl.className = 'status error';
                statusEl.textContent = 'Error: Credo script failed to load. Check your internet connection.';
                return;
            }

            const handler = CredoCheckout({
                // Replace with your actual Credo public key
                publicKey: 'pk_demo-xxxxxxxxxxxxx',

                // Transaction details
                amount: 350000, // Amount in kobo (3500 NGN)
                currency: 'NGN',

                // Customer details
                customerEmail: 'test@example.com',
                customerName: 'Test User',
                customerPhoneNo: '08012345678',

                // Reference (should be unique per transaction)
                reference: 'CREDO_' + Date.now(),

                // Callbacks
                onSuccess: function(response) {
                    console.log('Payment Success:', response);
                    statusEl.className = 'status success';
                    statusEl.textContent = 'Payment successful! Reference: ' + response.reference;
                },

                onCancel: function() {
                    console.log('Payment Cancelled');
                    statusEl.className = 'status cancelled';
                    statusEl.textContent = 'Payment was cancelled.';
                },

                onError: function(error) {
                    console.log('Payment Error:', error);
                    statusEl.className = 'status error';
                    statusEl.textContent = 'Payment failed: ' + (error.message || 'Unknown error');
                }
            });

            // Open payment modal
            handler.openIframe();
        }
    </script>
</body>
</html>
